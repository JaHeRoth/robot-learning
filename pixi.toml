[workspace]
authors = ["Jacob H. Rothschild"]
channels = ["conda-forge"]
name = "robot-learning"
platforms = [{ platform = "osx-arm64", macos = "14.0" }]
version = "0.1.0"

[tasks]
eval = "python scripts/eval_quiet.py"

[dependencies]
python = ">=3.12,<3.13"
wandb = ">=0.28.2,<0.29"
ipykernel = ">=7.3.0,<8"
ipywidgets = ">=8.1.9,<9"

[pypi-dependencies]
lerobot = { version = ">=0.3.3, <0.4", extras = ["pusht"] }
