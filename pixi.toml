[workspace]
authors = ["Jacob H. Rothschild"]
channels = ["conda-forge"]
name = "robot-learning"
platforms = [{ platform = "osx-arm64", macos = "14.0" }, { platform = "linux-64", glibc = "2.31" }]
version = "0.1.0"

# PyTorch's pip wheel and conda-forge ffmpeg each bundle LLVM's OpenMP runtime;
# loading both aborts the process without this override (decode correctness verified).
[activation.env]
KMP_DUPLICATE_LIB_OK = "TRUE"

[tasks]
eval = "python scripts/eval_quiet.py"

[dependencies]
python = ">=3.12,<3.13"
wandb = ">=0.28.2,<0.29"
ipykernel = ">=7.3.0,<8"
ipywidgets = ">=8.1.9,<9"
matplotlib = ">=3.11.1,<4"
ffmpeg = ">=7,<8"
polars = ">=1.44.1,<2"

[pypi-dependencies]
lerobot = { version = ">=0.3.3, <0.4", extras = ["pusht", "feetech"] }
mujoco = ">=3.12.0, <4"

# Headless boxes have no display and (on compute-only NVIDIA images) no EGL, so
# MuJoCo falls back to software GL. See README for the system package it needs.
[target.linux-64.activation.env]
MUJOCO_GL = "osmesa"
