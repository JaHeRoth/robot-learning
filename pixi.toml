[workspace]
authors = ["Jacob H. Rothschild"]
channels = ["conda-forge"]
name = "robot-learning"
platforms = [{ platform = "osx-arm64", macos = "14.0" }, { platform = "linux-64", glibc = "2.31" }]
version = "0.1.0"

# PyTorch's pip wheel and conda-forge ffmpeg each bundle LLVM's OpenMP runtime;
# loading both aborts the process without this override (decode correctness verified).
[activation.env]
KMP_DUPLICATE_LIB_OK = "TRUE"

[tasks]
eval = "python scripts/eval_quiet.py"

# uvc-util is macOS-only; settings reset on replug, so teleop re-applies them
[target.osx-arm64.tasks]
lock-cams = """
tools/uvc-util -V 0x32e6:0x9005 \
    -s auto-exposure-mode=1 -s exposure-time-abs=250 -s gamma=200 \
    -s auto-white-balance-temp=false -s white-balance-temp=2800 && \
tools/uvc-util -V 0x0c45:0x6366 \
    -s auto-exposure-mode=1 -s exposure-time-abs=250 -s gain=0 \
    -s auto-white-balance-temp=false -s white-balance-temp=3200"""

# wrist cam reports 5 fps to OpenCV but delivers ~22.5
[target.osx-arm64.tasks.teleop]
depends-on = ["lock-cams"]
cmd = """
lerobot-teleoperate \
    --robot.type=so101_follower --robot.port=/dev/cu.usbmodem5C4C1264891 --robot.id=follower \
    --robot.cameras="{ \
        innomaker: {type: opencv, index_or_path: 0, width: 640, height: 480, fps: 30, rotation: 180}, \
        wrist: {type: opencv, index_or_path: 1, width: 640, height: 480, fps: 5}}" \
    --teleop.type=so101_leader --teleop.port=/dev/cu.usbmodem58FA1026071 --teleop.id=leader \
    --display_data=true"""

# extra args append and override, e.g. pixi run record --dataset.repo_id=jacob/foo
[target.osx-arm64.tasks.record]
depends-on = ["lock-cams"]
cmd = """
lerobot-record \
    --robot.type=so101_follower --robot.port=/dev/cu.usbmodem5C4C1264891 --robot.id=follower \
    --robot.cameras="{ \
        innomaker: {type: opencv, index_or_path: 0, width: 640, height: 480, fps: 30, rotation: 180}, \
        wrist: {type: opencv, index_or_path: 1, width: 640, height: 480, fps: 5}}" \
    --teleop.type=so101_leader --teleop.port=/dev/cu.usbmodem58FA1026071 --teleop.id=leader \
    --dataset.single_task="Touch the bullseye with the gripper" \
    --dataset.fps=20 --dataset.episode_time_s=10 --dataset.reset_time_s=8 \
    --dataset.push_to_hub=false --display_data=true"""

[dependencies]
python = ">=3.12,<3.13"
wandb = ">=0.28.2,<0.29"
ipykernel = ">=7.3.0,<8"
ipywidgets = ">=8.1.9,<9"
matplotlib = ">=3.11.1,<4"
ffmpeg = ">=7,<8"
polars = ">=1.44.1,<2"

[pypi-dependencies]
lerobot = { version = ">=0.3.3, <0.4", extras = ["pusht", "feetech"] }
mujoco = ">=3.12.0, <4"

# Headless boxes have no display and (on compute-only NVIDIA images) no EGL, so
# MuJoCo falls back to software GL. See README for the system package it needs.
[target.linux-64.activation.env]
MUJOCO_GL = "osmesa"
